urn (d.confidence||0)+Math.min(40,hits*8)}$('scan').onclick=async()=>{if(busy)return;lock(true);let w;try{await images();if(!photos.length)throw Error('請先選擇名片圖片');if(!window.Tesseract)throw Error('OCR 元件未載入');$('scan').disabled=true;w=await Tesseract.createWorker('chi_tra+eng',1,{logger:m=>$('status').textContent='辨識中：'+m.status+' '+Math.round((m.progress||0)*100)+'%'});await w.setParameters({tessedit_pageseg_mode:'11'});let texts=[],codes=[],weak=false;for(let i=0;i<photos.length;i++){let c=await prepare(photos[i],i),angles=c.height>c.width?[90,270,0,180]:[0,180,90,270],best=null;for(let a of angles){let n=rotate(c,a),r=await w.recognize(n);if(!best||score(r.data)>score(best.data))best={data:r.data,n};if(score(r.data)>=105&&r.data.confidence>=65)break}let r=await w.recognize(enhance(best.n));if(score(r.data)>score(best.data))best.data=r.data;await w.setParameters({tessedit_pageseg_mode:'6'});r=await w.recognize(best.n);if(score(r.data)>score(best.data))best.data=r.data;await w.setParameters({tessedit_pageseg_mode:'11'});texts.push(best.data.text);if(best.data.confidence<55||score(best.data)<65)weak=true;if(window.jsQR){let x=c.getContext('2d').getImageData(0,0,c.width,c.height),q=jsQR(x.data,x.width,x.height);if(q)codes.push(q.data)}}$('raw').value=texts.join('\n');if(!weak)parse();else $('status').textContent='辨識可信度偏低，未自動填入。請檢查原始文字、旋轉或重拍，再按拆解文字欄位。';if(codes.length)inputs().find(x=>x.dataset.field==='QR Code內容').value=[...new Set(codes)].join('；')}catch(e){$('status').textContent='辨識未完成：'+e.message+'。仍可手動建檔。'}finally{try{if(w)await w.terminate()}finally{lock(false)}}};

$('form').onsubmit=async e=>{e.preventDefault();if(busy||!ready)return;let next=e.submitter?.value!=='stay',o=val();if(!o['公司名稱']&&!o['姓名'])return alert('請至少輸入公司或姓名');let old=records.find(r=>r.id===editing);if(records.some(r=>r.id!==editing&&((o['Email']&&r['Email']===o['Email'])||(o['手機']&&r['手機']===o['手機'])||(o['姓名']&&o['公司名稱']&&r['姓名']===o['姓名']&&r['公司名稱']===o['公司名稱'])))&&!confirm('可能有重複名片，仍要儲存？'))return;lock(true);try{await images();let now=new Date().toISOString(),r={...o,id:old?.id||crypto.randomUUID(),created:old?.created||now,updated:now,raw:$('raw').value,photos:[...photos]};await commit([...records.filter(x=>x.id!==r.id),r]);if(!old)sessionCount++;$('session').textContent='本次新增：'+sessionCount+' 筆｜名片庫共 '+records.length+' 筆';$('saved').textContent='已儲存：'+[r['公司名稱'],r['姓名']].filter(Boolean).join('｜');if(next){reset();$('status').textContent='上一張已儲存，請拍攝下一張名片。';$('entry').scrollIntoView({block:'start'});}else{editing=r.id;fill(r);$('status').textContent='已儲存至本機名片庫'}}catch(e){$('status').textContent='儲存未完成，已保留表單，請重試。'+e.message}finally{lock(false)}};$('clear').onclick=()=>{if(busy)return;if((photos.length||$('raw').value||Object.values(val()).some(Boolean))&&!confirm('清空目前表單？未儲存內容將遺失。'))return;reset();$('status').textContent='請拍攝下一張名片。';$('entry').scrollIntoView({block:'start'})};function render(){$('count').textContent=records.length+' 筆';$('list').replaceChildren();let q=$('search').value.toLowerCase();for(let r of [...records].reverse().filter(r=>fields.some(f=>String(r[f]||'').toLowerCase().includes(q)))){let a=document.createElement('article'),h=document.createElement('strong');h.textContent=[r['姓名'],r['公司名稱'],r['職稱']].filter(Boolean).join('｜');a.append(h);let p=document.createElement('p');p.textContent=[r['手機'],r['市內電話'],r['Email'],r['下次追蹤日期']?'追蹤：'+r['下次追蹤日期']:''].filter(Boolean).join('｜');a.append(p);for(let [k,pre] of [['手機','tel:'],['市內電話','tel:'],['Email','mailto:'],['地址','https://www.google.com/maps/search/?api=1&query='],['公司網站','']]){let v=(r[k]||'
