<!doctype html><html lang="zh-Hant-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#173b64"><link rel="apple-touch-icon" href="icon-192.png"><title>智慧名片 CRM</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5fa;color:#18334e;font:16px system-ui,sans-serif}header{background:#173b64;color:white;padding:22px}main{max-width:850px;margin:auto;padding:16px}section{background:white;border:1px solid #dce4ee;border-radius:16px;padding:18px;margin-bottom:16px}h1,h2{margin:0 0 12px}button,input,textarea,select{font:inherit;border:1px solid #bac9d8;border-radius:8px;padding:10px}button{background:#245b91;color:white;cursor:pointer;margin:4px 2px}button.secondary{background:white;color:#245b91}input,textarea,select{width:100%;margin:4px 0 10px}label{display:block;font-size:14px} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}small{color:#53677b}img{max-width:100%;max-height:180px}article{border-top:1px solid #ddd;padding:12px 0}a{color:#245b91}details{margin:12px 0}#status{white-space:pre-wrap} @media(max-width:480px){main{padding:10px}section{padding:14px}.grid{grid-template-columns:1fr}button{min-height:44px}}button:disabled{opacity:.5}</style><header><h1>智慧名片 CRM</h1>免登入・本機名片管理｜V1.1 公開分享準備版</header><main><section><h2>掃描與新增名片</h2><small>請只處理有權保存的名片。OCR 在瀏覽器執行，首次需連網下載辨識元件及語言模型。</small><label>名片正面（拍照或選擇圖片）<input id="front" type="file" accept="image/*" capture="environment"></label><label>名片背面（選填）<input id="back" type="file" accept="image/*"></label><div id="preview"></div><button id="scan">開始 OCR 辨識</button><button class="secondary" id="clear">新增空白名片</button><p id="status" role="status"></p><label>原始辨識文字（可貼上或修正）<textarea id="raw" rows="5"></textarea></label><button class="secondary" id="parse">拆解文字欄位</button><form id="form"><div class="grid" id="basic"></div><details><summary>展開進階欄位</summary><div class="grid" id="advanced"></div></details><small id="created"></small><br><button type="submit">確認儲存</button></form></section><section><h2>我的名片庫 <span id="count"></span></h2><input id="search" placeholder="搜尋姓名、公司、電話、地址…"><div id="list"></div></section><section><h2>匯出與備份</h2><button id="xlsx">匯出 Excel (.xlsx)</button><button id="csv">匯出 CSV（Excel 可開啟）</button><button id="backup">完整 JSON 備份</button><label>還原備份<input id="restore" type="file" accept=".json,application/json"></label><small>資料只存在目前瀏覽器，清除網站資料或更換裝置可能遺失。備份包含個資，請妥善保管。</small></section></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const $=id=>document.getElementById(id), basic=['公司名稱','姓名','職稱','市內電話','分機','手機','傳真','Email','地址','公司網站','LINE ID'], advanced=['公司英文名稱','英文姓名','部門','統一編號','其他電話','其他Email','其他地址','LINE官方帳號','QR Code內容','Facebook','Instagram','WhatsApp','WeChat','LinkedIn','產品服務','客戶分類','開發進度','下次追蹤日期','拜訪紀錄','備註'], fields=[...basic,...advanced];let records=[],editing=null,photos=[],db;for(const [id,arr] of [['basic',basic],['advanced',advanced]])for(const f of arr){let l=document.createElement('label');l.textContent=f;let x=document.createElement(f==='拜訪紀錄'||f==='備註'?'textarea':'input');x.dataset.field=f;if(f==='下次追蹤日期')x.type='date';l.append(x);$(id).append(l)}const inputs=()=>[...document.querySelectorAll('[data-field]')];const val=()=>Object.fromEntries(inputs().map(x=>[x.dataset.field,x.value.trim()]));function fill(o){inputs().forEach(x=>x.value=o[x.dataset.field]||'');$('raw').value=o.raw||'';$('created').textContent=o.created?'首次建檔：'+new Date(o.created).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'首次建檔時間將於儲存時產生';photos=o.photos||[];showPhotos()}function showPhotos(){$('preview').replaceChildren();for(const p of photos){let i=document.createElement('img');i.src=p;$('preview').append(i)}}function reset(){editing=null;fill({});$('front').value=$('back').value=''}function read(f){return new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}async function images(){let fs=[$('front').files[0],$('back').files[0]].filter(Boolean);if(fs.length){photos=await Promise.all(fs.map(read));showPhotos()}return photos}for(const id of ['front','back'])$(id).onchange=()=>images().catch(e=>$('status').textContent=e.message);function parse(){let t=$('raw').value,lines=t.split(/\n/).map(x=>x.trim()).filter(Boolean),o={};const add=(k,v)=>{if(v)o[k]=o[k]?o[k]+'；'+v:v};for(let l of lines){let m;if(m=l.match(/(?:傳真|FAX)\s*[:：]?\s*([+\d()\s.-]+)/i))add('傳真',m[1].trim());else if(m=l.match(/(?:手機|Mobile|Cell)\s*[:：]?\s*([+\d()\s.-]+)/i))add('手機',m[1].trim());else if(m=l.match(/(?:電話|TEL|Phone)\s*[:：]?\s*([+\d()\s.-]+)/i))add('市內電話',m[1].trim());else if(m=l.match(/(?:09\d{2}[- ]?\d{3}[- ]?\d{3})/))add('手機',m[0]);else if(m=l.match(/(?:\(0\d{1,2}\)|0\d{1,2}-)\s*\d{6,8}/))add('市內電話',m[0]);if(m=l.match(/(?:分機|ext\.?|#)\s*[:：]?\s*(\d+)/i))add('分機',m[1]);for(const e of l.match(/[\w.+-]+@[\w.-]+\.[a-z]{2,}/gi)||[])add('Email',e);if(m=l.match(/(?:https?:\/\/|www\.)[^\s]+/i))add('公司網站',m[0]);if(m=l.match(/(?:LINE\s*(?:ID)?)[：:\s]+([\w.@-]+)/i))add('LINE ID',m[1]);if(m=l.match(/(?:統編|統一編號)\s*[:：]?\s*(\d{8})/))add('統一編號',m[1]);if(/公司|企業社|Co\.,?\s*Ltd|Corporation/i.test(l)&&!o['公司名稱']&&!/@/.test(l))o['公司名稱']=l;if(/(?:市|縣).*(?:路|街|巷|號)/.test(l))add('地址',l.replace(/^地址[:：]?/,''));if(/^(?:姓名|Name)[:：]/i.test(l))o['姓名']=l.split(/[:：]/).slice(1).join(':').trim();if(/^(?:職稱|Title)[:：]/i.test(l))o['職稱']=l.split(/[:：]/).slice(1).join(':').trim();}inputs().forEach(x=>{if(o[x.dataset.field]&&!x.value)x.value=o[x.dataset.field]});$('status').textContent='欄位拆解完成，請核對所有欄位；未辨識資料請手動補充。'}$('parse').onclick=parse;$('scan').onclick=async()=>{let w;try{await images();if(!photos.length)throw Error('請先選擇名片圖片');if(!window.Tesseract)throw Error('OCR 元件未載入，請確認網路');$('scan').disabled=true;w=await Tesseract.createWorker('chi_tra+eng',1,{logger:m=>$('status').textContent='辨識中：'+m.status+' '+Math.round((m.progress||0)*100)+'%'});let texts=[];for(const p of photos){let r=await w.recognize(p);texts.push(r.data.text)}$('raw').value=texts.join('\n');parse();if('BarcodeDetector' in window){try{let d=new BarcodeDetector({formats:['qr_code']});let codes=[];for(const p of photos){let im=new Image();im.src=p;await im.decode();for(const c of await d.detect(im))codes.push(c.rawValue)}if(codes.length)inputs().find(x=>x.dataset.field==='QR Code內容').value=codes.join('；')}catch{}}}catch(e){$('status').textContent='辨識未完成：'+e.message+'。仍可手動建檔。'}finally{if(w)await w.terminate();$('scan').disabled=false}};
function persist(){return new Promise((res,rej)=>{let t=db.transaction('data','readwrite');t.objectStore('data').put(records,'records');t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}async function commit(next){let old=records;records=next;try{await persist();render()}catch(e){records=old;alert('儲存失敗：'+e.message);throw e}}$('form').onsubmit=async e=>{e.preventDefault();let o=val();if(!o['公司名稱']&&!o['姓名'])return alert('請至少輸入公司或姓名');let old=records.find(r=>r.id===editing);if(records.some(r=>r.id!==editing&&((o['Email']&&r['Email']===o['Email'])||(o['手機']&&r['手機']===o['手機'])||(o['姓名']&&o['公司名稱']&&r['姓名']===o['姓名']&&r['公司名稱']===o['公司名稱'])))&&!confirm('可能有重複名片，仍要儲存？'))return;await images();let now=new Date().toISOString(),r={...o,id:old?.id||crypto.randomUUID(),created:old?.created||now,updated:now,raw:$('raw').value,photos:[...photos]};await commit([...records.filter(x=>x.id!==r.id),r]);editing=r.id;fill(r);$('status').textContent='已儲存至本機名片庫'};$('clear').onclick=reset;function render(){$('count').textContent=records.length+' 筆';$('list').replaceChildren();let q=$('search').value.toLowerCase();for(let r of [...records].reverse().filter(r=>fields.some(f=>String(r[f]||'').toLowerCase().includes(q)))){let a=document.createElement('article'),h=document.createElement('strong');h.textContent=[r['姓名'],r['公司名稱'],r['職稱']].filter(Boolean).join('｜');a.append(h);let p=document.createElement('p');p.textContent=[r['手機'],r['市內電話'],r['Email'],r['下次追蹤日期']?'追蹤：'+r['下次追蹤日期']:''].filter(Boolean).join('｜');a.append(p);for(let [k,pre] of [['手機','tel:'],['市內電話','tel:'],['Email','mailto:'],['地址','https://www.google.com/maps/search/?api=1&query='],['公司網站','']]){let v=(r[k]||'').split('；')[0];if(!v)continue;let link=document.createElement('a');if(k==='公司網站'){if(!/^https?:\/\//i.test(v))v='https://'+v;try{if(!['http:','https:'].includes(new URL(v).protocol))continue}catch{continue}}link.href=pre+(k==='地址'?encodeURIComponent(v):v);link.textContent=k+'　';link.target='_blank';link.rel='noopener noreferrer';a.append(link)}for(let [label,fn] of [['編輯',()=>{editing=r.id;$('front').value=$('back').value='';fill(r);scrollTo(0,0)}],['刪除',()=>{if(confirm('確定刪除此名片？'))commit(records.filter(x=>x.id!==r.id))}]]){let b=document.createElement('button');b.className='secondary';b.textContent=label;b.onclick=fn;a.append(b)}$('list').append(a)}}$('search').oninput=render;function download(name,content,type){let u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('xlsx').onclick=()=>{if(!window.XLSX)return alert('Excel 元件尚未載入，請連網或改用 CSV');let cols=[...fields,'首次建檔時間','最後修改時間'];let rows=records.map(r=>[...fields.map(k=>String(r[k]||'')),r.created,r.updated]);let w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([cols,...rows]),'名片庫');XLSX.writeFile(w,'智慧名片CRM.xlsx')};$('backup').onclick=()=>download('CRM-backup.json',JSON.stringify({version:1,records}), 'application/json');$('csv').onclick=()=>{let cols=[...fields,'created','updated'];let esc=v=>'"'+String(v??'').replace(/^[\s]*[=+\-@]/,"'$&").replaceAll('"','""')+'"';download('CRM.csv','\ufeff'+[cols,...records.map(r=>cols.map(k=>r[k]))].map(row=>row.map(esc).join(',')).join('\r\n'),'text/csv;charset=utf-8')};$('restore').onchange=async()=>{try{let b=JSON.parse(await $('restore').files[0].text());if(b.version!==1||!Array.isArray(b.records))throw Error('格式不符');let m=new Map(records.map(r=>[r.id,r]));for(let r of b.records){if(typeof r.id!=='string'||!Number.isFinite(Date.parse(r.created)))throw Error('資料格式不符');let clean=Object.fromEntries(fields.map(f=>[f,typeof r[f]==='string'?r[f]:'']));m.set(r.id,{...clean,id:r.id,created:m.get(r.id)?.created||r.created,updated:r.updated||r.created,raw:typeof r.raw==='string'?r.raw:'',photos:Array.isArray(r.photos)?r.photos.filter(p=>typeof p==='string'&&/^data:image\/(jpeg|png|webp|gif);base64,/.test(p)):[]})}if(confirm('合併備份資料？相同 ID 將更新。'))await commit([...m.values()])}catch(e){alert('還原失敗：'+e.message)}};let req=indexedDB.open('smart-card-crm',1);req.onupgradeneeded=()=>req.result.createObjectStore('data');req.onsuccess=()=>{db=req.result;let r=db.transaction('data').objectStore('data').get('records');r.onsuccess=()=>{records=r.result||[];render()}};req.onerror=()=>alert('本機資料庫無法開啟，請使用一般瀏覽模式');reset();</script><script>if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(console.warn);</script></html>
